<!DOCTYPE html>
<html>
<head>
    <title>To-Do App</title>

    <style>

        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 40px;
        }

        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            width: 70%;
            padding: 10px;
        }

        button {
            padding: 10px;
        }

        li {
            margin: 10px 0;
        }

        a {
            color: red;
            text-decoration: none;
            margin-left: 10px;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>To-Do List</h2>

    <form action="/add" method="post">

        <input type="text" name="task" placeholder="Enter task" required>

        <button type="submit">Add</button>

    </form>

    <ul>

        <li th:each="task, stat : ${tasks}">

            <span th:text="${task}"></span>

            <a th:href="@{'/delete/' + ${stat.index}}">Delete</a>

        </li>

    </ul>

</div>

</body>
</html>
